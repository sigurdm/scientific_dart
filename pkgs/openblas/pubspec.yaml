name: openblas
description: FFI bindings for OpenBLAS.
version: 0.0.2
resolution: workspace
repository: https://github.com/sigurdm/scientific_dart/tree/main/pkgs/openblas

environment:
  sdk: ^3.10.0

# Add regular dependencies here.
dependencies:
  ffi: ^2.2.0
  hooks: ^1.0.3
  code_assets: ^1.0.0
  archive: ^3.6.1
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
  ffigen: ^20.1.1
  criterion:
    git: https://github.com/sigurdm/criterion.git

ffigen:
  name: OpenBlas
  description: FFI bindings for OpenBLAS.
  output: 'lib/src/openblas_bindings.dart'
  ffi-native:
    asset-id: 'package:openblas/openblas'
  headers:
    entry-points:
      - 'third_party/openblas/openblas_minimal.h'

